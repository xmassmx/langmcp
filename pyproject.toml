[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "langmcp"
version = "0.1.1"
description = "Development MCP server for LangGraph checkpoint and store inspection"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.13"
authors = [{ name = "LangMCP Contributors" }]
keywords = ["langgraph", "langchain", "mcp", "checkpointer", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp>=1.27,<2",
    "typer>=0.12,<1.0",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.14,<3",
    "python-dotenv>=1.2,<2",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint>=4.1,<5",
]

[project.optional-dependencies]
postgres = [
    "langgraph-checkpoint-postgres>=3.1,<4",
    "psycopg[binary,pool]>=3.3,<4",
]
sqlite = ["langgraph-checkpoint-sqlite>=3.1,<4"]
redis = ["langgraph-checkpoint-redis>=0.4,<0.5"]
tiktoken = ["tiktoken>=0.13,<0.14"]
all = [
    "langmcp[postgres,sqlite,redis,tiktoken]",
]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
    "ruff==0.15.15",
    "httpx==0.28.1",
    "langchain-core==1.4.0",
    "fastmcp>=2.0",
]

[project.scripts]
langmcp = "langmcp.cli:app"

[project.urls]
Homepage = "https://github.com/xmassmx/langmcp"
Documentation = "https://github.com/xmassmx/langmcp#readme"
Repository = "https://github.com/xmassmx/langmcp"

[tool.hatch.build.targets.wheel]
packages = ["src/langmcp"]

[tool.hatch.build.targets.wheel.sources]
"src/langmcp" = "langmcp"

[tool.hatch.build.targets.wheel.force-include]
"src/langmcp/apps/inspector.html" = "langmcp/apps/inspector.html"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
markers = [
    "integration: integration tests requiring docker services",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/langmcp/cli.py" = ["B008"]
