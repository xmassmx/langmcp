[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langmcp"
version = "0.1.0"
description = "Development MCP server for LangGraph checkpoint and store inspection"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "LangMCP Contributors" }]
keywords = ["langgraph", "langchain", "mcp", "checkpointer", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp>=1.0,<2",
    "typer>=0.12",
    "pydantic>=2",
    "pydantic-settings>=2",
    "langgraph>=0.4",
    "langgraph-checkpoint>=2",
]

[project.optional-dependencies]
postgres = [
    "langgraph-checkpoint-postgres>=2",
    "psycopg[binary,pool]>=3",
]
sqlite = ["langgraph-checkpoint-sqlite>=2"]
redis = ["langgraph-checkpoint-redis>=0.3"]
tiktoken = ["tiktoken>=0.5"]
all = [
    "langmcp[postgres,sqlite,redis,tiktoken]",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "httpx>=0.27",
    "langchain-core>=0.3",
]

[project.scripts]
langmcp = "langmcp.cli:app"

[project.urls]
Documentation = "https://docs.langchain.com/oss/python/langgraph/persistence"
Repository = "https://github.com/xmassmx/langmcp"

[tool.hatch.build.targets.wheel]
packages = ["src/langmcp"]

[tool.hatch.build.targets.wheel.sources]
"src/langmcp" = "langmcp"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
markers = [
    "integration: integration tests requiring docker services",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/langmcp/cli.py" = ["B008"]
